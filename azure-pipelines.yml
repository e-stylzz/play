trigger:
  branches:
    include:
      - main
  paths:
    include:
      - app/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - app/**

parameters:
  - name: containerRegistry
    displayName: Container Registry Login Server
    type: string
    default: ''
  - name: imageRepository
    displayName: Image Repository Name
    type: string
    default: 'weather-api'
  - name: imageTag
    displayName: Image Tag
    type: string
    default: '$(Build.BuildId)'
  - name: dockerfileContext
    displayName: Docker build context (relative to repo root)
    type: string
    default: 'app'

variables:
  - name: IMAGE_FULL_NAME
    value: '${{ parameters.containerRegistry }}/${{ parameters.imageRepository }}:${{ parameters.imageTag }}'
  - name: IMAGE_LATEST
    value: '${{ parameters.containerRegistry }}/${{ parameters.imageRepository }}:latest'

stages:
  - stage: Build
    displayName: Build & Push Container Image
    jobs:
      - job: BuildAndPush
        displayName: Build and Push Docker Image
        pool:
          vmImage: ubuntu-latest

        steps:
          - checkout: self

          - task: Docker@2
            displayName: Build Docker Image
            inputs:
              command: build
              dockerfile: '${{ parameters.dockerfileContext }}/Dockerfile'
              buildContext: '${{ parameters.dockerfileContext }}'
              repository: ${{ parameters.imageRepository }}
              tags: |
                ${{ parameters.imageTag }}
                latest

          - task: Docker@2
            displayName: Push to Container Registry
            condition: and(succeeded(), ne('${{ parameters.containerRegistry }}', ''))
            inputs:
              command: push
              containerRegistry: containerRegistryServiceConnection
              repository: ${{ parameters.imageRepository }}
              tags: |
                ${{ parameters.imageTag }}
                latest

          - task: PublishPipelineArtifact@1
            displayName: Publish image metadata
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: image-metadata
              publishLocation: pipeline

  - stage: TerraformPlan
    displayName: Terraform Plan
    dependsOn: []
    condition: succeeded()
    jobs:
      - job: TerraformPlan
        displayName: Run Terraform Plan
        pool:
          vmImage: ubuntu-latest

        steps:
          - checkout: self

          - script: |
              wget -q https://releases.hashicorp.com/terraform/1.8.0/terraform_1.8.0_linux_amd64.zip
              unzip -q terraform_1.8.0_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: Install Terraform

          - script: terraform init
            workingDirectory: terraform
            displayName: Terraform Init

          - script: |
              terraform plan \
                -var="container_registry_name=$(CONTAINER_REGISTRY_NAME)" \
                -out=tfplan
            workingDirectory: terraform
            displayName: Terraform Plan
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              CONTAINER_REGISTRY_NAME: $(CONTAINER_REGISTRY_NAME)

          - task: PublishPipelineArtifact@1
            displayName: Publish Terraform Plan
            inputs:
              targetPath: terraform/tfplan
              artifact: tfplan
              publishLocation: pipeline
